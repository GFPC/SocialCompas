# --- Subdomain: api.socialcompass.ru (All API & Docs) ---
server {
    server_name api.socialcompass.ru;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.socialcompass.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.socialcompass.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- Main Domain: socialcompass.ru & www.socialcompass.ru (Clean MiniApp SPA Only) ---
server {
    server_name socialcompass.ru www.socialcompass.ru 80.90.189.13;

    root /home/SocialCompas/miniapp/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/socialcompass.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialcompass.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP 80 Redirections ---
server {
    if ($host = api.socialcompass.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.socialcompass.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = socialcompass.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name socialcompass.ru www.socialcompass.ru api.socialcompass.ru 80.90.189.13;
    return 404;
}
