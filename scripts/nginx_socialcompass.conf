# =========================================================
# 1. API Subdomain: api.socialcompass.ru (FastAPI Backend & Swagger Docs)
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.socialcompass.ru;

    ssl_certificate /etc/letsencrypt/live/api.socialcompass.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.socialcompass.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Forward ALL requests on api.socialcompass.ru to FastAPI Backend (127.0.0.1:8000)
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================================================
# 2. Main Site: socialcompass.ru & www.socialcompass.ru (Clean MiniApp Frontend Only)
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name socialcompass.ru www.socialcompass.ru 80.90.189.13;

    root /home/SocialCompas/miniapp/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # MiniApp SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/socialcompass.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialcompass.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# =========================================================
# 3. HTTP (Port 80) -> HTTPS (Port 443) Redirects
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name socialcompass.ru www.socialcompass.ru api.socialcompass.ru 80.90.189.13;

    if ($host = api.socialcompass.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.socialcompass.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = socialcompass.ru) {
        return 301 https://$host$request_uri;
    }

    return 301 https://$host$request_uri;
}
