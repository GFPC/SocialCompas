name: SocialCompas CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Bot & Architecture Tests
        run: |
          python test_bot.py

  deploy:
    name: Deploy to Dedicated Server (80.90.189.13)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Starting Automated Deployment to /home/SocialCompas..."
            cd /home/SocialCompas
            git pull origin main
            
            echo "📦 Building MiniApp Frontend..."
            cd miniapp
            npm install
            npm run build
            cd ..
            
            echo "🐳 Restarting Docker Services..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            echo "🔄 Reloading Nginx..."
            systemctl reload nginx
            
            echo "✅ Deployment Finished Successfully!"
