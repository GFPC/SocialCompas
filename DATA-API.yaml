# DATA-API.yaml — SocialCompass Data API & Verification Specification

config_version: "2.0.0"
solution_name: "SocialCompass"
team_id: "GFPC / SocialCompass"
base_url: "https://api.socialcompass.ru"

# ─────────────────────────────────────────────────────────
# Авторизация тестовых ролей
# Данные пользователя (профиль, избранное) доступны только владельцу: Bearer-токен должен
# принадлежать тому же user_id, иначе 403. Токены НЕ хранятся в репозитории — значения
# TOKEN_STUDENT / TOKEN_PENSIONER указаны на служебном (первом) слайде презентации.
# Токен можно получить и самостоятельно: POST /api/v1/auth/webapp с init_data, подписанным
# токеном бота (алгоритм: https://dev.max.ru/docs/webapps/validation).
# ─────────────────────────────────────────────────────────
auth:
  scheme: "Bearer"
  header: "Authorization: Bearer <token>"
  roles:
    guest:
      description: "Без токена (публичный каталог)"
    student:
      user_id: "998877"
      token: "${TOKEN_STUDENT}"
      accounts_file: "data/test_accounts.json"
    pensioner:
      user_id: "554433"
      token: "${TOKEN_PENSIONER}"
      accounts_file: "data/test_accounts.json"

# ─────────────────────────────────────────────────────────
# Обязательные проверки работоспособности API
# ─────────────────────────────────────────────────────────
checks:
  - id: check_cities
    name: "Получение списка поддерживаемых городов"
    endpoint: "/api/v1/cities"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"
      schema_example:
        ok: true
        count: 3
        items:
          - id: 1
            name: "Москва"
            is_active: 1

  - id: check_categories
    name: "Получение списка категорий благополучателей"
    endpoint: "/api/v1/categories"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"

  - id: check_places_filtering
    name: "Получение каталога мест с фильтрацией по городу и категории"
    endpoint: "/api/v1/places"
    method: "GET"
    role: "guest"
    parameters:
      query:
        city: "Москва"
        category: "Студенты"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"

  - id: check_place_detail
    name: "Получение подробной карточки места по ID"
    # id 4004 существует в боевой БД (id задаются при импорте каталога; актуальный список — в ответе /api/v1/places)
    endpoint: "/api/v1/places/4004"
    method: "GET"
    role: "guest"
    parameters:
      path:
        place_id: 4004
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "place"

  - id: check_profile_by_user_id
    name: "Синхронизация профиля по ID пользователя MAX Messenger"
    endpoint: "/api/v1/profile/998877"
    method: "GET"
    role: "student"
    headers:
      Authorization: "Bearer ${TOKEN_STUDENT}"
    parameters:
      path:
        user_id: "998877"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "profile"

  - id: check_unauthorized_favorites
    name: "Ограничение неавторизованного доступа к избранному (401)"
    endpoint: "/api/v1/favorites"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 401
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "detail"

  - id: check_profile_requires_token
    name: "Профиль пользователя недоступен без токена (401)"
    endpoint: "/api/v1/profile/998877"
    method: "GET"
    role: "guest"
    parameters:
      path:
        user_id: "998877"
    expected_status_code: 401
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "detail"

  - id: check_foreign_token_forbidden
    name: "Токен другого пользователя не даёт доступ к чужому профилю (403)"
    endpoint: "/api/v1/profile/998877"
    method: "GET"
    role: "pensioner"
    headers:
      Authorization: "Bearer ${TOKEN_PENSIONER}"
    parameters:
      path:
        user_id: "998877"
    expected_status_code: 403
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "detail"

  - id: check_favorites_by_user
    name: "Избранное владельца по user_id"
    endpoint: "/api/v1/favorites/998877"
    method: "GET"
    role: "student"
    headers:
      Authorization: "Bearer ${TOKEN_STUDENT}"
    parameters:
      path:
        user_id: "998877"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"

  - id: check_tampered_init_data
    name: "Подделанный initData отклоняется (401)"
    endpoint: "/api/v1/auth/webapp"
    method: "POST"
    role: "guest"
    parameters:
      body:
        init_data: "auth_date=1000000&user=%7B%22id%22%3A1%7D&hash=fakehash"
    expected_status_code: 401
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "detail"

  - id: check_ai_chat
    name: "Интеграция с ИИ-ассистентом с передачей контекста"
    endpoint: "/api/v1/chat"
    method: "POST"
    role: "student"
    parameters:
      body:
        messages:
          - role: "user"
            content: "Какие музеи со скидкой есть в Москве?"
        city: "Москва"
        category: "Студенты"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "message"

# ─────────────────────────────────────────────────────────
# Схемы и сущности данных в БД (Data Schema)
# ─────────────────────────────────────────────────────────
entities:
  City:
    table_name: cities
    description: Каталог городов присутствия сервиса
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      name: { type: string(64), required: true, unique: true }
      is_active: { type: integer, default: 1 }

  Category:
    table_name: categories
    description: Справочник льготных категорий благополучателей
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      name: { type: string(64), required: true, unique: true }
      is_active: { type: integer, default: 1 }

  Place:
    table_name: places
    description: Каталог партнерских мест, льгот и скидочных предложений
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      city: { type: string(64), required: true }
      category: { type: string(64), required: true }
      title: { type: string(255), required: true }
      place_type: { type: string(64), default: "Место" }
      promo_text: { type: text, required: true }
      schedule: { type: string(255) }
      address: { type: string(255) }
      map_url: { type: string(255) }

  UserProfile:
    table_name: user_profiles
    description: Сохраненный профиль пользователя (город и категория)
    primary_key: user_id (VARCHAR(64))
    fields:
      user_id: { type: string(64), required: true }
      city: { type: string(64), required: true }
      category: { type: string(64), required: true }

  UserFavorite:
    table_name: user_favorites
    description: Связь «Пользователь — Избранное место»
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      user_id: { type: string(64), required: true }
      place_id: { type: integer, required: true }
