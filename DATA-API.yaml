# DATA-API.yaml — SocialCompass Data API & Verification Specification

config_version: "2.0.0"
solution_name: "SocialCompass"
team_id: "GFPC / SocialCompass"
base_url: "https://api.socialcompass.ru"

# ─────────────────────────────────────────────────────────
# Обязательные проверки работоспособности API
# ─────────────────────────────────────────────────────────
checks:
  - id: check_cities
    name: "Получение списка поддерживаемых городов"
    endpoint: "/api/v1/cities"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"
      schema_example:
        ok: true
        count: 3
        items:
          - id: 1
            name: "Москва"
            is_active: 1

  - id: check_categories
    name: "Получение списка категорий благополучателей"
    endpoint: "/api/v1/categories"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"

  - id: check_places_filtering
    name: "Получение каталога мест с фильтрацией по городу и категории"
    endpoint: "/api/v1/places"
    method: "GET"
    role: "guest"
    parameters:
      query:
        city: "Москва"
        category: "Студенты"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "count"
        - "items"

  - id: check_place_detail
    name: "Получение подробной карточки места по ID"
    endpoint: "/api/v1/places/1"
    method: "GET"
    role: "guest"
    parameters:
      path:
        place_id: 1
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "place"

  - id: check_profile_by_user_id
    name: "Синхронизация профиля по ID пользователя MAX Messenger"
    endpoint: "/api/v1/profile/998877"
    method: "GET"
    role: "student"
    parameters:
      path:
        user_id: "998877"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "profile"

  - id: check_unauthorized_favorites
    name: "Ограничение неавторизованного доступа к избранному (401)"
    endpoint: "/api/v1/favorites"
    method: "GET"
    role: "guest"
    parameters: {}
    expected_status_code: 401
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "detail"

  - id: check_ai_chat
    name: "Интеграция с ИИ-ассистентом с передачей контекста"
    endpoint: "/api/v1/chat"
    method: "POST"
    role: "student"
    parameters:
      body:
        messages:
          - role: "user"
            content: "Какие музеи со скидкой есть в Москве?"
        city: "Москва"
        category: "Студенты"
    expected_status_code: 200
    expected_response_format:
      content_type: "application/json"
      mandatory_fields:
        - "ok"
        - "message"

# ─────────────────────────────────────────────────────────
# Схемы и сущности данных в БД (Data Schema)
# ─────────────────────────────────────────────────────────
entities:
  City:
    table_name: cities
    description: Каталог городов присутствия сервиса
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      name: { type: string(64), required: true, unique: true }
      is_active: { type: integer, default: 1 }

  Category:
    table_name: categories
    description: Справочник льготных категорий благополучателей
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      name: { type: string(64), required: true, unique: true }
      is_active: { type: integer, default: 1 }

  Place:
    table_name: places
    description: Каталог партнерских мест, льгот и скидочных предложений
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      id: { type: integer, required: true }
      city: { type: string(64), required: true }
      category: { type: string(64), required: true }
      title: { type: string(255), required: true }
      place_type: { type: string(64), default: "Место" }
      promo_text: { type: text, required: true }
      schedule: { type: string(255) }
      address: { type: string(255) }
      map_url: { type: string(255) }

  UserProfile:
    table_name: user_profiles
    description: Сохраненный профиль пользователя (город и категория)
    primary_key: user_id (VARCHAR(64))
    fields:
      user_id: { type: string(64), required: true }
      city: { type: string(64), required: true }
      category: { type: string(64), required: true }

  UserFavorite:
    table_name: user_favorites
    description: Связь «Пользователь — Избранное место»
    primary_key: id (INT, AUTO_INCREMENT)
    fields:
      user_id: { type: string(64), required: true }
      place_id: { type: integer, required: true }
