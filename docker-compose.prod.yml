services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialcompas_app
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN:-YOUR_MAX_BOT_TOKEN_HERE}
      - MAX_BOT_USERNAME=${MAX_BOT_USERNAME:-}
      - MAX_API_URL=https://platform-api2.max.ru
      - SIMULATION_MODE=false
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=bot_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-bot_password}
      - MYSQL_DB=socialcompas_db
      - AITUNNEL_API_KEY=${AITUNNEL_API_KEY:-YOUR_AITUNNEL_API_KEY_HERE}
      - AITUNNEL_BASE_URL=https://api.aitunnel.ru/v1
      - AI_MODEL=gpt-4o-mini
      - CHAT_RATE_LIMIT_PER_MINUTE=10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.0
    container_name: socialcompas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: socialcompas_db
      MYSQL_USER: bot_user
      MYSQL_PASSWORD: bot_password
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: socialcompas_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  mysql_prod_data:
  redis_prod_data:

networks:
  app_net:
    driver: bridge
